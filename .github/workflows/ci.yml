name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests deliberately run on Linux with no Arc present. Anything that
  # needs Arc has to skip itself, so a missing browser can never mask a real
  # failure in the pure-Node parts.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # package.json declares os: darwin, which is true of the server but makes
      # npm refuse to install on a Linux runner. --force overrides just that
      # platform check; the unit tests themselves never touch Arc.
      - name: Install
        run: npm ci --force

      - name: Test
        run: npm test

  syntax:
    name: Syntax check src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install needed: node --check parses without resolving imports, so a
      # syntax error in any module fails here even if it is never imported.
      - name: node --check every file in src/
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
